<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Full-stack header: from the screen to the schema</title>
  <desc id="heroDesc">A browser, an application and a database connected as three layers, with the phrase from the screen to the schema.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1c2a3d"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5c7086"/>
    </marker>
  </defs>
  <rect width="1000" height="250" rx="8" fill="#0b1220"/>
  <rect width="1000" height="250" rx="8" fill="url(#dots)"/>
  <text x="72" y="40" fill="#6e7f95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2">FULL STACK / 01</text>
  <text x="72" y="118" fill="#f4ecdd" font-family="Georgia, 'Times New Roman', serif" font-size="44">from the screen</text>
  <text x="72" y="164" fill="#f4ecdd" font-family="Georgia, 'Times New Roman', serif" font-size="44">to the <tspan fill="#79c0ff" font-style="italic">schema.</tspan></text>
  <text x="72" y="205" fill="#8fa3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">react · spring · postgres</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="700" y="44" width="230" height="42" rx="8" fill="#111a2b" stroke="#79c0ff"/>
    <text x="720" y="70" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">01</text>
    <g stroke="#79c0ff" fill="none">
      <rect x="742" y="56" width="16" height="14" rx="2"/>
      <path d="M742 60H758"/>
      <circle cx="745" cy="58" r="0.8" fill="#79c0ff" stroke="none"/>
    </g>
    <text x="768" y="70" fill="#e6edf3" font-size="14">interface</text>

    <path d="M815 88V102" stroke="#5c7086" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="700" y="105" width="230" height="42" rx="8" fill="#111a2b" stroke="#7ee787"/>
    <text x="720" y="131" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">02</text>
    <g stroke="#7ee787" fill="none">
      <rect x="742" y="117" width="16" height="14" rx="2"/>
      <path d="M742 122H758M742 126H758"/>
    </g>
    <text x="768" y="131" fill="#e6edf3" font-size="14">application</text>

    <path d="M815 149V163" stroke="#5c7086" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="700" y="166" width="230" height="42" rx="8" fill="#111a2b" stroke="#d2a8ff"/>
    <text x="720" y="192" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">03</text>
    <g stroke="#d2a8ff" fill="none">
      <ellipse cx="750" cy="175" rx="8" ry="3"/>
      <path d="M742 175V186C742 187.7 745.6 189 750 189S758 187.7 758 186V175"/>
      <path d="M742 180C742 181.7 745.6 183 750 183S758 181.7 758 180"/>
    </g>
    <text x="768" y="192" fill="#e6edf3" font-size="14">data</text>
  </g>
</svg>
