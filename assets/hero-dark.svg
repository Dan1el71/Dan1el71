  <text x="72" y="128" fill="#f4ecdd" font-family="Georgia, 'Times New Roman', serif" font-size="45">make it <tspan fill="#7ee787" font-style="italic">reconcile.</tspan></text>
  <text x="72" y="163" fill="#8fa3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">double-entry ledgers · billing · payments</text>
