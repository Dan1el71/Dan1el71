<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">System flow</title>
  <desc id="flowDesc">Client to API to domain rules to PostgreSQL, with domain rules writing to an outbox that publishes to Kafka.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
    <rect x="10" y="44" width="130" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="75" y="71" fill="#1f2328" text-anchor="middle">client</text>

    <rect x="200" y="44" width="130" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="265" y="71" fill="#1f2328" text-anchor="middle">api</text>

    <rect x="390" y="44" width="150" height="44" rx="6" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="465" y="71" fill="#1f2328" text-anchor="middle">domain rules</text>

    <rect x="610" y="44" width="150" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="685" y="71" fill="#1f2328" text-anchor="middle">postgresql</text>

    <rect x="390" y="132" width="150" height="42" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="465" y="158" fill="#1f2328" text-anchor="middle">outbox</text>

    <rect x="610" y="132" width="150" height="42" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="685" y="158" fill="#1f2328" text-anchor="middle">kafka</text>

    <g stroke="#57606a" stroke-width="1.2" fill="none">
      <path d="M140 66H196" marker-end="url(#arrow)"/>
      <path d="M330 66H386" marker-end="url(#arrow)"/>
      <path d="M540 66H606" marker-end="url(#arrow)"/>
      <path d="M465 88V128" marker-end="url(#arrow)"/>
      <path d="M540 153H606" marker-end="url(#arrow)"/>
    </g>
  </g>
</svg>
